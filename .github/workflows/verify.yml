name: Forex-Pobre Verify (OANDA-first)
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Typecheck, build and unit tests
        run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NEAT engine
        run: python -m pip install "neat-python>=2.1,<3"
      - name: Verify five genuine NEAT genomes and predictions
        run: python neat/smoke_test.py
